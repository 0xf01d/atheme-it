/*
 * Minimal atheme.conf for exercising the import_azzurra one-shot module
 * inside the atheme-imp-build container.  Not part of the committed module;
 * test scaffolding only.
 */

serverinfo {
    name = "services.int";
    desc = "Azzurra import verification instance";
    numeric = "00A";
    vhost = "127.0.0.1";
    netname = "ExampleNet";
    hidehostsuffix = "users.misconfigured";
    adminname = "Test Admin";
    adminemail = "admin@example.net";
    loglevel = "debug";
};

uplink "irc.example.net" {
    host = "127.0.0.1";
    port = 6667;
    password = "linkage";
};

loadmodule "protocol/charybdis";
loadmodule "backend/opensex";
loadmodule "crypto/pbkdf2v2";
loadmodule "nickserv/main";
loadmodule "chanserv/main";
loadmodule "import_azzurra/main";

import_azzurra {
    enabled;
    dry_run;
    nick_db = "/work/test/nick.db";
    chan_db = "/work/test/chan.db";
};
